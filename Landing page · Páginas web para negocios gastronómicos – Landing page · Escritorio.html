  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Páginas web para restaurantes, cafeterías y food trucks...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"es\"><head><style data-dc-design-system-vars=\"\">@layer{:root{--azul:#00256a;--amarillo:#ffad00;--blanco:#ffffff;--azul-brillante:#0093d9;--azul-claro:#9cd5f0;--gris:#dadada;--gris-borde:#8c8c8c;--boton-principal-hover:#003585;--boton-principal-activo:#001a4d;--boton-secundario-hover:#eaf5fc;--boton-secundario-activo:#d7ebf8;--boton-destacado-hover:#ffc247;--boton-destacado-activo:#e69b00;--error:#b3261e;--shadow-none:none;--shadow-sm:0 2px 6px rgba(0, 37, 106, 0.08);--shadow-md:0 4px 12px rgba(0, 37, 106, 0.12);--shadow-lg:0 8px 24px rgba(0, 37, 106, 0.16);--shadow-focus:0 0 0 3px rgba(0, 147, 217, 0.35);--space-xs:4px;--space-s:8px;--space-m:16px;--space-l:24px;--space-xl:32px;--space-2xl:48px;--radius-boton:8px;--radius-tarjeta:12px;--radius-campo:8px;--contenido-ancho-max:1200px;--seccion-separacion-min:64px;--seccion-separacion-max:96px;--margen-escritorio:24px;--margen-movil:16px;--borde-ancho:1px;--boton-altura-min:44px;--boton-padding-horizontal:20px;--boton-opacidad-deshabilitado:0.5;--campo-altura-min:44px;--campo-padding-horizontal:16px;--campo-opacidad-deshabilitado:0.5;--tarjeta-padding:24px;--icono-min:20px;--icono-max:24px;--icono-trazo:2px;--logo-ancho-min-digital:140px;--logo-ancho-min-impreso:35mm;--logo-proteccion:25%;--font-montserrat:Montserrat, system-ui, sans-serif;--font-lato:Lato, system-ui, sans-serif;--text-h1:700 48px/1.4 var(--font-montserrat);--text-h2:700 36px/1.4 var(--font-montserrat);--text-h3:600 26px/1.4 var(--font-montserrat);--text-h4:600 20px/1.4 var(--font-montserrat);--text-h1-movil:700 34px/1.4 var(--font-montserrat);--text-h2-movil:700 28px/1.4 var(--font-montserrat);--text-texto:400 16px/1.4 var(--font-lato);--text-texto-destacado:700 18px/1.4 var(--font-lato);--text-texto-auxiliar:400 14px/1.4 var(--font-lato);--text-boton:600 15px/1.4 var(--font-montserrat);}}<\u002Fstyle>\n<meta charset=\"utf-8\">\n<title>Páginas web para restaurantes, cafeterías y food trucks<\u002Ftitle>\n<script src=\"1e3e0c4f-61a2-49bc-ab2c-f6b4a01a28da\"><\u002Fscript>\n<style>/* AV Consultoría Empresarial: componentes web.\n   Design System v1.1 y Ajustes v1.2, valores provisionales. Todo sale de los tokens.\n   Botones: parámetros y estados de la v1.2. Tarjetas y campos: alturas, rellenos y estados sugeridos,\n   pendientes de validación. */\n\n/* Botones */\n.av-button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  box-sizing: border-box;\n  min-height: 44px;\n  padding: 0 20px;\n  border: 1px solid transparent;\n  border-radius: 8px;\n  box-shadow: none;\n  font-family: Montserrat, system-ui, sans-serif;\n  font-size: 15px;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n  transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;\n}\n.av-button:hover:not(:disabled),\n.av-button.is-hover { box-shadow: 0 4px 12px rgba(0, 37, 106, 0.12); }\n.av-button:active:not(:disabled),\n.av-button.is-active { box-shadow: none; }\n.av-button:focus-visible,\n.av-button.is-focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 147, 217, 0.35); }\n.av-button:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }\n\n.av-button--primary { background: #00256a; color: #ffffff; border-color: #00256a; }\n.av-button--primary:hover:not(:disabled),\n.av-button--primary.is-hover { background: #003585; border-color: #003585; }\n.av-button--primary:active:not(:disabled),\n.av-button--primary.is-active { background: #001a4d; border-color: #001a4d; }\n\n.av-button--secondary { background: #ffffff; color: #00256a; border-color: #00256a; }\n.av-button--secondary:hover:not(:disabled),\n.av-button--secondary.is-hover { background: #eaf5fc; }\n.av-button--secondary:active:not(:disabled),\n.av-button--secondary.is-active { background: #d7ebf8; }\n\n.av-button--accent { background: #ffad00; color: #00256a; border-color: #ffad00; }\n.av-button--accent:hover:not(:disabled),\n.av-button--accent.is-hover { background: #ffc247; border-color: #ffc247; }\n.av-button--accent:active:not(:disabled),\n.av-button--accent.is-active { background: #e69b00; border-color: #e69b00; }\n\n@media (prefers-reduced-motion: reduce) {\n  .av-button { transition: none; }\n}\n\n/* Tarjeta informativa */\n.av-card {\n  box-sizing: border-box;\n  padding: 24px;\n  background: #ffffff;\n  border: 1px solid #dadada;\n  border-radius: 12px;\n  box-shadow: none;\n  color: #00256a;\n}\n.av-card__icon {\n  display: block;\n  width: 24px;\n  height: 24px;\n  margin-bottom: 16px;\n  color: #00256a;\n}\n.av-card__title {\n  margin: 0 0 8px;\n  font-family: Montserrat, system-ui, sans-serif;\n  font-size: 20px;\n  font-weight: 600;\n  color: #00256a;\n}\n.av-card__text {\n  margin: 0;\n  font-family: Lato, system-ui, sans-serif;\n  font-size: 16px;\n  font-weight: 400;\n  color: #00256a;\n}\n/* Tarjeta interactiva: toda la tarjeta es un enlace o un botón */\n.av-card--interactive {\n  display: block;\n  text-decoration: none;\n  cursor: pointer;\n  transition: border-color 160ms ease, box-shadow 160ms ease;\n}\n.av-card--interactive:hover,\n.av-card--interactive.is-hover { border-color: #0093d9; box-shadow: 0 4px 12px rgba(0, 37, 106, 0.12); }\n.av-card--interactive:active,\n.av-card--interactive.is-active { border-color: #00256a; box-shadow: none; }\n.av-card--interactive:focus-visible,\n.av-card--interactive.is-focus { outline: none; border-color: #00256a; box-shadow: 0 0 0 3px rgba(0, 147, 217, 0.35); }\n\n/* Campo de formulario */\n.av-field {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  font-family: Lato, system-ui, sans-serif;\n  color: #00256a;\n}\n.av-field__label,\n.av-field__help {\n  font-size: 14px;\n  font-weight: 400;\n}\n.av-field__help {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n.av-field__help svg {\n  flex: none;\n  width: 20px;\n  height: 20px;\n}\n.av-field__control {\n  box-sizing: border-box;\n  width: 100%;\n  min-height: 44px;\n  padding: 0 16px;\n  background: # -btn\" style=\"background: #ffd23f; color: #1d1d1b\">Llámanos<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption><p style=\"margin: 0 0 4px; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.25\">Food truck<\u002Fp><p style=\"margin: 0; font-size: 14px\">Dónde estás hoy y qué vendes, de un vistazo.<\u002Fp><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<p class=\"lp-rv\" style=\"display: flex; align-items: flex-start; gap: 12px; margin: 0; padding: 16px 20px; border-radius: 12px; background: #eef8fc\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><span>Estos ejemplos muestran el resultado posible; no son un catálogo. No tienes que elegir una plantilla antes de contratar.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"incluye\" class=\"lp-bg lp-bg-claro-b\" style=\"background-color: #eef8fc; padding: clamp(56px, 5.6vw, 80px) 0\">\n<div style=\"box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 2vw, 24px); display: flex; flex-direction: column; gap: 40px\">\n<div class=\"lp-rv\" style=\"max-width: 760px\">\n<p style=\"display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px\"><span style=\"width: 32px; height: 4px; border-radius: 2px; background: #ffad00\"><\u002Fspan>El paquete<\u002Fp>\n<h2 style=\"margin: 0 0 12px; font-family: Montserrat, system-ui, sans-serif; font-size: clamp(28px, 1.4vw + 22px, 36px); font-weight: 700; line-height: 1.2\">Qué incluye el servicio<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px\">Sabes exactamente qué estás comprando.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 24px\">\n<div class=\"av-card lp-rv\" style=\"display: flex; align-items: flex-start; gap: 16px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><div><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Página web profesional<\u002Fh3><p class=\"av-card__text\">Construida sobre una plantilla prediseñada y probada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"av-card lp-rv lp-s2\" style=\"display: flex; align-items: flex-start; gap: 16px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><div><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Adaptación a tu identidad<\u002Fh3><p class=\"av-card__text\">Usamos tu logotipo, tus colores y tu tipografía, si los tienes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"av-card lp-rv lp-s3\" style=\"display: flex; align-items: flex-start; gap: 16px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><div><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Tus fotos y tu información<\u002Fh3><p class=\"av-card__text\">Menú, horarios, dirección, contacto y redes sociales.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"av-card lp-rv\" style=\"display: flex; align-items: flex-start; gap: 16px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><div><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Tres propuestas visuales<\u002Fh3><p class=\"av-card__text\">Tres vistas previas de tu página, con la imagen de tu negocio.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"av-card lp-rv lp-s2\" style=\"display: flex; align-items: flex-start; gap: 16px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><div><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Publicación de tu favorita<\u002Fh3><p class=\"av-card__text\">Eliges una propuesta y la publicamos como tu sitio.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"av-card lp-rv lp-s3\" style=\"display: flex; align-items: flex-start; gap: 16px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg><div><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Configuración para buscadores<\u002Fh3><p class=\"av-card__text\">Preparación básica para que puedan encontrar tu página.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"av-card lp-rv\" style=\"display: flex; flex-wrap: wrap; gap: 24px 48px\">\n<div style=\"flex: 2 1 360px\"><h3 class=\"av-card__title\" style=\"line-height: 1.25\">Lo que este paquete no incluye<\u002Fh3><p class=\"av-card__text\">No hacemos desarrollos totalmente personalizados. Trabajamos con tres plantillas prediseñadas que adaptamos a tu negocio; por eso el proceso es más simple.<\u002Fp><\u002Fdiv>\n<dl style=\"flex: 1 1 300px; display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-content: center; margin: 0\">\n<dt style=\"font-weight: 700\">Precio<\u002Fdt><dd style=\"margin: 0\">[PRECIO POR DEFINIR]<\u002Fdd>\n<dt style=\"font-weight: 700\">Tiempo de entrega<\u002Fdt><dd style=\"margin: 0\">[POR DEFINIR]<\u002Fdd>\n<dt style=\"font-weight: 700\">Revisiones<\u002Fdt><dd style=\"margin: 0\">[POR DEFINIR]<\u002Fdd>\n<\u002Fdl>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"visibilidad\" style=\"background: #ffffff; padding: clamp(56px, 5.6vw, 80px) 0\">\n<div style=\"box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 2vw, 24px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 48px 64px; align-items: center\">\n<div>\n<p class=\"lp-rv\" style=\"display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px\"><span style=\"width: 32px; height: 4px; border-radius: 2px; background: #ffad00\"><\u002Fspan>Visibilidad en Google y buscadores de IA<\u002Fp>\n<h2 class=\"lp-rv\" style=\"margin: 0 0 16px; font-family: Montserrat, system-ui, sans-serif; font-size: clamp(28px, 1.4vw + 22px, 36px); font-weight: 700; line-height: 1.2; text-wrap: balance\">No solo publicamos tu página: la dejamos lista para que la encuentren.<\u002Fh2>\n<p class=\"lp-rv\" style=\"margin: 0 0 24px; text-wrap: pretty\">Preparamos tu sitio por dentro para que los buscadores tradicionales y los sistemas de inteligencia artificial puedan descubrir y entender la información de tu negocio.<\u002Fp>\n<ul class=\"lp-rv\" style=\"display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none\">\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Buenas prácticas básicas para buscadores (SEO).<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Títulos y descripciones claros.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Contenido ordenado y fácil de leer.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Datos estructurados de tu negocio, cuando corresponde.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Conexión con Google Search Console.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Envío del mapa de tu sitio (sitemap) a Google.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Vinculación con tu ficha de Google Business Profile, si ya tienes una.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<div class=\"lp-rv\" role=\"img\" aria-label=\"Ilustración: la información de tu negocio organizada en tu página web\" style=\"padding: 24px; border: 1px solid #dadada; border-radius: 12px; background: #ffffff; box-shadow: 0 8px 24px rgba(0, 37, 106, 0.16)\">\n<div aria-hidden=\"true\" style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; border: 1px solid #8c8c8c; border-radius: 8px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><circle cx=\"10.5\" cy=\"10.5\" r=\"5.5\"><\u002Fcircle><path d=\"m15 15 5 5\"><\u002Fpath><\u002Fsvg><span>Tu negocio<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 12px; background: #eef8fc\">\n<p style=\"margin: 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.25\">[Nombre de tu negocio]<\u002Fp>\n<p style=\"margin: 0; font-size: 14px\">[Descripción breve de tu negocio]<\u002Fp>\n<div style=\"display: flex; align-items: center; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M4 6h16M4 12h16M4 18h16\"><\u002Fpath><\u002Fsvg><span>Menú<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M7 3v4m10-4v4M3 10h18m-14 5h2m3 0h2m3 0h1\"><\u002Fpath><\u002Fsvg><span>Horarios<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M6 3H4a1 1 0 0 0-1 1c0 9 8 17 17 17a1 1 0 0 0 1-1v-2a1 1 0 0 0-.7-.9l-4-1.3a1 1 0 0 0-1 .2l-1.6 1.6a14 14 0 0 1-7.3-7.3L8 8.7a1 1 0 0 0 .2-1L6.9 3.7A1 1 0 0 0 6 3Z\"><\u002Fpath><\u002Fsvg><span>Teléfono y dirección<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"lp-rv\" style=\"display: flex; align-items: flex-start; gap: 10px; margin: 0; padding: 16px; border-radius: 12px; background: #eef8fc; font-size: 14px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><path d=\"M10.3 4.9a2 2 0 0 1 3.4 0L21 17a2 2 0 0 1-1.7 3H4.7A2 2 0 0 1 3 17L10.3 4.9Z\"><\u002Fpath><path d=\"M12 9v4m0 3h.01\"><\u002Fpath><\u002Fsvg><span>Preparamos tu sitio para facilitar que lo encuentren, pero no garantizamos indexación, posiciones, tráfico ni apariciones en respuestas de inteligencia artificial. Eso depende de cada buscador.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"video\" class=\"lp-bg lp-bg-claro-a\" style=\"background-color: #eef8fc; padding: clamp(56px, 5.6vw, 80px) 0\">\n<div style=\"box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 2vw, 24px); display: flex; flex-wrap: wrap; align-items: center; gap: 40px 48px\">\n<div class=\"lp-rv\" style=\"flex: 3 1 480px; min-width: 0\">\n<div style=\"position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #00256a; color: #ffffff; box-shadow: 0 8px 24px rgba(0, 37, 106, 0.16)\">\n<button class=\"lp-play\" type=\"button\" aria-label=\"Reproducir video explicativo (pendiente de producción)\" style=\"display: flex; align-items: center; justify-content: center; width: 88px; height: 88px; padding: 0; border: 0; border-radius: 50%; background: #ffad00; color: #00256a; cursor: pointer\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l10.5-6.5L8 5.5Z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<p style=\"margin: 0; padding: 0 24px; font-size: 14px; text-align: center\">[VIDEO EXPLICATIVO · PENDIENTE DE PRODUCCIÓN]<\u002Fp>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 24px; right: 24px; bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 14px\"><span style=\"flex: 1 1 auto; height: 4px; border-radius: 2px; background: #0093d9\"><\u002Fspan><span>[DURACIÓN]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 2 1 300px; min-width: 0\">\n<p class=\"lp-rv\" style=\"display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px\"><span style=\"width: 32px; height: 4px; border-radius: 2px; background: #ffad00\"><\u002Fspan>Video explicativo<\u002Fp>\n<h2 class=\"lp-rv\" style=\"margin: 0 0 20px; font-family: Montserrat, system-ui, sans-serif; font-size: clamp(28px, 1.4vw + 22px, 36px); font-weight: 700; line-height: 1.2; text-wrap: balance\">Míralo en un video corto.<\u002Fh2>\n<ul class=\"lp-rv\" style=\"display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none\">\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Qué es el servicio.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Para quién es.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Cómo funciona la contratación.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Qué información necesitas compartir.<\u002Fli>\n<li style=\"display: flex; align-items: flex-start; gap: 10px\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsvg>Cómo recibes y eliges tus tres propuestas.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"preguntas\" style=\"background: #ffffff; padding: clamp(56px, 5.6vw, 80px) 0\">\n<div style=\"box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 2vw, 24px); display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px 64px\">\n<div class=\"lp-rv\" style=\"flex: 1 1 300px; min-width: 0\">\n<p style=\"display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px\"><span style=\"width: 32px; height: 4px; border-radius: 2px; background: #ffad00\"><\u002Fspan>Dudas comunes<\u002Fp>\n<h2 style=\"margin: 0 0 16px; font-family: Montserrat, system-ui, sans-serif; font-size: clamp(28px, 1.4vw + 22px, 36px); font-weight: 700; line-height: 1.2\">Preguntas frecuentes<\u002Fh2>\n<p style=\"margin: 0; text-wrap: pretty\">Lo que más nos preguntan los dueños de restaurantes, cafeterías y food trucks antes de contratar.<\u002Fp>\n<\u002Fdiv>\n<div class=\"lp-faq lp-rv\" style=\"flex: 2 1 520px; min-width: 0; border-top: 1px solid #dadada\">\n<details open=\"open\" style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Necesito conocimientos de diseño web?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">No. Solo necesitas compartir la información de tu negocio. Nosotros nos encargamos del diseño y de la publicación.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Cómo funciona el proceso de contratación?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Contratas y pagas en línea. Después compartes los datos de tu negocio, recibes tres propuestas visuales, eliges una y publicamos tu sitio.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Cuándo elijo el diseño de mi página?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Después de contratar. Primero preparamos tres propuestas con la imagen de tu negocio y entonces eliges la que más te guste. No tienes que elegir una plantilla antes de pagar.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Las tres propuestas tendrán la imagen de mi negocio?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Sí. Cada propuesta usa tu identidad visual, tus fotografías y tu contenido. Verás tres vistas previas de tu propio establecimiento.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Qué información necesito proporcionar?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Nombre comercial, menú, fotografías del negocio y de tus productos, dirección, horarios, teléfono y datos de contacto, redes sociales y una descripción de tu negocio. Si tienes logotipo, colores o tipografía, también puedes compartirlos.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Qué pasa si no tengo logotipo o colores corporativos?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Puedes contratar sin ellos. El proceso contempla negocios que todavía no tienen logotipo ni colores definidos: lo indicas al compartir tu información.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Mi página podrá aparecer en Google?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Preparamos tu página con buenas prácticas para que Google pueda descubrirla: la conectamos con Google Search Console y enviamos el mapa del sitio. No podemos garantizar que aparezca ni en qué posición, porque eso depende de Google.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Mi negocio podrá aparecer en búsquedas de inteligencia artificial?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Organizamos la información de tu página para que los sistemas de IA puedan leerla y entenderla con facilidad. No podemos garantizar que tu negocio aparezca en sus respuestas.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Puedo solicitar un diseño completamente personalizado?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Este paquete no incluye desarrollo personalizado. Trabajamos con tres plantillas prediseñadas que adaptamos a la identidad y al contenido de tu negocio.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #dadada\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: Montserrat, system-ui, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.3\"><span>¿Qué sucede después de elegir mi propuesta favorita?<\u002Fspan><svg class=\"lp-chev\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 20px 0\">Preparamos tu sitio con la plantilla que elegiste y lo publicamos.<\u002Fp>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contratar\" class=\"lp-onblue lp-bg lp-bg-azul-b\" style=\"position: relative; overflow: hidden; background-color: #00256a; color: #ffffff; padding: clamp(64px, 6.2vw, 88px) 0\">\n<div class=\"lp-rv\" style=\"position: relative; box-sizing: border-box; max-width: 808px; margin: 0 auto; padding: 0 clamp(16px, 2vw, 24px); display: flex; flex-direction: column; align-items: center; text-align: center\">\n<h2 style=\"margin: 0 0 16px; font-family: Montserrat, system-ui, sans-serif; font-size: clamp(28px, 1.4vw + 22px, 36px); font-weight: 700; line-height: 1.2; text-wrap: balance\">Tu negocio merece tener su propio espacio en internet.<\u002Fh2>\n<p style=\"margin: 0 0 32px; font-size: 18px; text-wrap: pretty\">El proceso es sencillo y no necesitas conocimientos técnicos: contratas, compartes la información de tu negocio y eliges entre tres propuestas con tu identidad.<\u002Fp>\n<a class=\"av-button av-button--accent\" href=\"#contratar\" style=\"margin: 0 0 24px\">Contrata tu página web<\u002Fa>\n<a href=\"#como-funciona\" style=\"font-family: Montserrat, system-ui, sans-serif; font-size: 15px; font-weight: 600\">Conoce cómo funciona<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"lp-onblue\" style=\"background: #00256a; color: #ffffff; border-top: 1px solid #0093d9\">\n<div style=\"box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 24px clamp(16px, 2vw, 24px) 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px\">\n<img src=\"04f2fbe3-a70a-4818-b15b-881fdcfebed3\" alt=\"AV Consultoría Empresarial\" style=\"display: block; width: 200px; height: auto\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 14px; text-align: right\">\n<span>[CORREO DE CONTACTO] · [TELÉFONO]<\u002Fspan>\n<span>AV Consultoría Empresarial<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animaciones&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst on = this.props.animaciones ?? true;\nreturn { motion: on ? 'lp-anim' : '' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
